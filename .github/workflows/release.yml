name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # creating the GitHub release needs write access to the repository's contents
      contents: write
      # Open VSX trusted publishing trades this job's ID token for a registry token valid for minutes
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check the palette and the generated files
        run: |
          npm run check
          npm run verify
      - name: Check the tag matches the palette version
        run: |
          version=$(node -p "require('./palette/zacess.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the palette version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: |
          mkdir -p ../../dist
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies --out "../../dist/zacess-themes-$VERSION.vsix"
      - name: Build the JetBrains plugin
        working-directory: editors/jetbrains
        run: |
          ./gradlew buildPlugin
          cp build/distributions/*.zip ../../dist/
      - name: Zip the Obsidian theme
        working-directory: editors/obsidian
        run: zip "../../dist/zacess-obsidian-$VERSION.zip" manifest.json theme.css
      - name: Zip the Sublime Text, Helix and Emacs themes
        working-directory: editors
        run: |
          (cd sublime && zip "../../dist/zacess-sublime-$VERSION.zip" ./*.sublime-color-scheme)
          (cd helix/themes && zip "../../../dist/zacess-helix-$VERSION.zip" ./*.toml)
          (cd emacs && zip "../../dist/zacess-emacs-$VERSION.zip" ./*.el)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release notes are this version's section of the changelog
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Zacess Themes $VERSION" --notes-file notes.md
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Skipped the VS Code Marketplace: the VSCE_PAT secret is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes @vscode/vsce@4.0.0 publish --packagePath "dist/zacess-themes-$VERSION.vsix"
          echo "Published $VERSION to the VS Code Marketplace." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to Open VSX
        run: |
          # no stored token: the registry accepts this repository and workflow as a trusted publisher
          npx --yes ovsx@1.2.0 publish --trusted-publishing "dist/zacess-themes-$VERSION.vsix"
          echo "Published $VERSION to Open VSX." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the JetBrains Marketplace
        working-directory: editors/jetbrains
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_TOKEN" ]; then
            echo "Skipped the JetBrains Marketplace: the JETBRAINS_TOKEN secret is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./gradlew publishPlugin
          echo "Published $VERSION to the JetBrains Marketplace." >> "$GITHUB_STEP_SUMMARY"
      - name: Update the read-only Obsidian and Neovim copies
        env:
          MIRROR_TOKEN: ${{ secrets.THEMES_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Skipped the read-only copies: the THEMES_MIRROR_TOKEN secret is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # each copy keeps its own README, licence and screenshot; only the generated files move
          mirror() {
            repo=$1 tag=$2; shift 2
            dir=$(mktemp -d)
            git clone --quiet "https://x-access-token:$MIRROR_TOKEN@github.com/zacesshq/$repo.git" "$dir"
            "$@" "$dir"
            cd "$dir" || return 1
            git add -A
            if git diff --cached --quiet; then
              echo "zacesshq/$repo already matches $VERSION." >> "$GITHUB_STEP_SUMMARY"
            else
              git -c user.name="Zac Bot" -c user.email=automation@isaacadjei.me commit --quiet -m "chore: update to Zacess Themes $VERSION"
              git push --quiet origin HEAD
            fi
            if ! GH_TOKEN=$MIRROR_TOKEN gh release view "$tag" --repo "zacesshq/$repo" >/dev/null 2>&1; then
              git tag "$tag" && git push --quiet origin "$tag"
              GH_TOKEN=$MIRROR_TOKEN gh release create "$tag" --repo "zacesshq/$repo" --verify-tag --title "$tag" \
                --notes "Matches zacesshq/themes v$VERSION." $MIRROR_ASSETS
              echo "Released $tag in zacesshq/$repo." >> "$GITHUB_STEP_SUMMARY"
            fi
            cd "$GITHUB_WORKSPACE" || return 1
          }
          copy_obsidian() { cp editors/obsidian/manifest.json editors/obsidian/theme.css "$1/"; }
          copy_neovim() { rm -f "$1"/colors/*.lua; cp editors/neovim/colors/*.lua "$1/colors/"; }
          # obsidian installs from a release tagged exactly as the manifest version, with both files attached
          MIRROR_ASSETS="$GITHUB_WORKSPACE/editors/obsidian/manifest.json $GITHUB_WORKSPACE/editors/obsidian/theme.css" mirror obsidian-theme "$VERSION" copy_obsidian
          MIRROR_ASSETS="" mirror zacess.nvim "v$VERSION" copy_neovim
