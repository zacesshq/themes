name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # the Microsoft Entra federated credential trusts this environment, so Marketplace sign-in only works inside it
    environment: release
    permissions:
      # the GitHub release and the read-only copies are made afterwards by scripts/release.mjs, so this job never writes to the repository
      contents: read
      # Open VSX trusted publishing and the Marketplace sign-in both trade this job's ID token for short-lived ones
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check the palette and the generated files
        run: |
          npm run check
          npm run verify
      - name: Check the tag matches the palette version
        run: |
          version=$(node -p "require('./palette/zacess.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the palette version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: |
          mkdir -p ../../dist
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies --out "../../dist/zacess-themes-$VERSION.vsix"
      - name: Build the JetBrains plugin
        working-directory: editors/jetbrains
        run: |
          ./gradlew buildPlugin
          cp build/distributions/*.zip ../../dist/
      - name: Zip the Obsidian theme
        working-directory: editors/obsidian
        run: zip "../../dist/zacess-obsidian-$VERSION.zip" manifest.json theme.css
      - name: Zip the Sublime Text, Helix, Emacs and Xcode themes
        working-directory: editors
        run: |
          (cd sublime && zip "../../dist/zacess-sublime-$VERSION.zip" ./*.sublime-color-scheme)
          (cd helix/themes && zip "../../../dist/zacess-helix-$VERSION.zip" ./*.toml)
          (cd emacs && zip "../../dist/zacess-emacs-$VERSION.zip" ./*.el)
          (cd xcode && zip "../../dist/zacess-xcode-$VERSION.zip" ./*.xccolortheme)
      - name: Check the changelog has a section for this version
        run: |
          # scripts/release.mjs uses this section as the release notes, so a missing one stops the release before anything is published
          grep -q "^## \\[$VERSION\\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # scripts/release.mjs downloads this artifact by name and attaches its files to the GitHub release
          name: zacess-themes-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # an app registration needs no subscription, so expiring subscription credits never break publishing
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        run: |
          # no stored token: the Entra identity is a Contributor on the zacess publisher
          npx --yes @vscode/vsce@4.0.0 publish --azure-credential --packagePath "dist/zacess-themes-$VERSION.vsix"
          echo "Published $VERSION to the VS Code Marketplace." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to Open VSX
        run: |
          # no stored token: the registry accepts this repository and workflow as a trusted publisher
          npx --yes ovsx@1.2.0 publish --trusted-publishing "dist/zacess-themes-$VERSION.vsix"
          echo "Published $VERSION to Open VSX." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the JetBrains Marketplace
        working-directory: editors/jetbrains
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_TOKEN" ]; then
            echo "Skipped the JetBrains Marketplace: the JETBRAINS_TOKEN secret is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./gradlew publishPlugin
          echo "Published $VERSION to the JetBrains Marketplace." >> "$GITHUB_STEP_SUMMARY"
      - name: Say what is left
        run: |
          echo "Built and published $VERSION. Run \`node scripts/release.mjs $VERSION\` to create the GitHub release and update the read-only copies." >> "$GITHUB_STEP_SUMMARY"
