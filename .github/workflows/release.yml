name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # creating the GitHub release needs write access to the repository's contents
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check the palette and the generated files
        run: |
          npm run check
          npm run verify
      - name: Check the tag matches the palette version
        run: |
          version=$(node -p "require('./palette/zacess.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the palette version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: |
          mkdir -p ../../dist
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies --out "../../dist/zacess-themes-$VERSION.vsix"
      - name: Build the JetBrains plugin
        working-directory: editors/jetbrains
        run: |
          ./gradlew buildPlugin
          cp build/distributions/*.zip ../../dist/
      - name: Zip the Obsidian theme
        working-directory: editors/obsidian
        run: zip "../../dist/zacess-obsidian-$VERSION.zip" manifest.json theme.css
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release notes are this version's section of the changelog
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Zacess Themes $VERSION" --notes-file notes.md
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Skipped the VS Code Marketplace: the VSCE_PAT secret is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes @vscode/vsce@4.0.0 publish --packagePath "dist/zacess-themes-$VERSION.vsix"
          echo "Published $VERSION to the VS Code Marketplace." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Skipped Open VSX: the OVSX_PAT secret is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes ovsx@1.2.0 publish "dist/zacess-themes-$VERSION.vsix"
          echo "Published $VERSION to Open VSX." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the JetBrains Marketplace
        working-directory: editors/jetbrains
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_TOKEN" ]; then
            echo "Skipped the JetBrains Marketplace: the JETBRAINS_TOKEN secret is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./gradlew publishPlugin
          echo "Published $VERSION to the JetBrains Marketplace." >> "$GITHUB_STEP_SUMMARY"
