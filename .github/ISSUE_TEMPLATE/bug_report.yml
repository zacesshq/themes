name: Bug report
description: A theme looks wrong, fails to install or does not match the palette.
labels: ["bug"]
body:
  - type: dropdown
    id: editor
    attributes:
      label: Editor or terminal
      options:
        - VS Code
        - JetBrains IDE
        - Obsidian
        - Neovim
        - Zed
        - Sublime Text
        - Helix
        - Emacs
        - Eclipse
        - Xcode
        - iTerm2
        - Alacritty
        - kitty
        - Ghostty
        - Windows Terminal
        - Other
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      multiple: true
      options:
        - Zacess Light
        - Zacess Dark
        - Zacess Yellow on Black
        - Zacess Cream
        - Zacess High Contrast Dark
        - Zacess High Contrast Light
        - Zacess Deep Contrast Dark
        - Zacess Deep Contrast Light
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message. A screenshot helps if you can share one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the theme from the latest release
        2. Open a TypeScript file
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Editor version and theme version
      placeholder: VS Code 1.105 on macOS 26, Zacess Themes 0.1.0
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have read the [Code of Conduct](https://github.com/zacesshq/themes/blob/main/CODE_OF_CONDUCT.md).
          required: true
