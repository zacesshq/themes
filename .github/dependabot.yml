version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  # the scripts have no runtime dependencies; this watches for any that are added later
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore

  - package-ecosystem: gradle
    directory: /editors/jetbrains
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      gradle:
        patterns: ["*"]
