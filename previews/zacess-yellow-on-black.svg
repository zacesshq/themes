  <text x="20" y="26" fill="#ffeb3b" font-weight="700">Zacess Yellow on Black</text>
  <text x="40" y="64" fill="#d9d9d9" text-anchor="end">1</text>
  <text x="56" y="64" xml:space="preserve"><tspan fill="#88c200" font-style="italic">// read the page aloud at the reader's pace</tspan></text>
  <text x="40" y="90" fill="#d9d9d9" text-anchor="end">2</text>
  <text x="56" y="90" xml:space="preserve"><tspan fill="#ffffff" font-weight="700">export</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#ffffff" font-weight="700">function</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#88c3ff">speak</tspan><tspan fill="#ffeb3b">(</tspan><tspan fill="#ffcca3" font-style="italic">page</tspan><tspan fill="#ffeb3b">: </tspan><tspan fill="#e5c7ff">Page</tspan><tspan fill="#ffeb3b">, </tspan><tspan fill="#ffcca3" font-style="italic">rate</tspan><tspan fill="#ffeb3b"> = </tspan><tspan fill="#ffa77e">1.25</tspan><tspan fill="#ffeb3b">): </tspan><tspan fill="#e5c7ff">string</tspan><tspan fill="#ffeb3b"> {</tspan></text>
  <rect x="0" y="98" width="720" height="26" fill="#141414"/>
  <text x="40" y="116" fill="#ffeb3b" text-anchor="end">3</text>
  <text x="56" y="116" xml:space="preserve"><tspan fill="#ffeb3b">  </tspan><tspan fill="#0cedf6" font-weight="700">if</tspan><tspan fill="#ffeb3b"> (!</tspan><tspan fill="#ffeb3b">page</tspan><tspan fill="#ffeb3b">.</tspan><tspan fill="#ffffff">text</tspan><tspan fill="#ffeb3b">) </tspan><tspan fill="#0cedf6" font-weight="700">return</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#43f480">&quot;&quot;</tspan><tspan fill="#ffeb3b">;</tspan></text>
  <text x="40" y="142" fill="#d9d9d9" text-anchor="end">4</text>
  <text x="56" y="142" xml:space="preserve"><tspan fill="#ffeb3b">  </tspan><tspan fill="#0cedf6" font-weight="700">return</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#ffeb3b">page</tspan><tspan fill="#ffeb3b">.</tspan><tspan fill="#ffffff">text</tspan><tspan fill="#ffeb3b">.</tspan><tspan fill="#88c3ff">replace</tspan><tspan fill="#ffeb3b">(</tspan><tspan fill="#ffa1ce">/\s+/g</tspan><tspan fill="#ffeb3b">, </tspan><tspan fill="#43f480">&quot; &quot;</tspan><tspan fill="#ffeb3b">);</tspan></text>
  <text x="40" y="168" fill="#d9d9d9" text-anchor="end">5</text>
  <text x="56" y="168" xml:space="preserve"><tspan fill="#ffeb3b">}</tspan></text>
  <text x="40" y="194" fill="#d9d9d9" text-anchor="end">6</text>
  <text x="40" y="220" fill="#d9d9d9" text-anchor="end">7</text>
  <text x="56" y="220" xml:space="preserve"><tspan fill="#ffffff" font-weight="700">def</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#88c3ff">ratio</tspan><tspan fill="#ffeb3b">(</tspan><tspan fill="#ffcca3" font-style="italic">hi</tspan><tspan fill="#ffeb3b">: </tspan><tspan fill="#e5c7ff">float</tspan><tspan fill="#ffeb3b">, </tspan><tspan fill="#ffcca3" font-style="italic">lo</tspan><tspan fill="#ffeb3b">: </tspan><tspan fill="#e5c7ff">float</tspan><tspan fill="#ffeb3b">) -&gt; </tspan><tspan fill="#e5c7ff">float</tspan><tspan fill="#ffeb3b">:</tspan></text>
  <text x="40" y="246" fill="#d9d9d9" text-anchor="end">8</text>
  <text x="56" y="246" xml:space="preserve"><tspan fill="#ffeb3b">    </tspan><tspan fill="#43f480">&quot;&quot;&quot;Return the WCAG contrast ratio.&quot;&quot;&quot;</tspan></text>
  <text x="40" y="272" fill="#d9d9d9" text-anchor="end">9</text>
  <text x="56" y="272" xml:space="preserve"><tspan fill="#ffeb3b">    </tspan><tspan fill="#0cedf6" font-weight="700">return</tspan><tspan fill="#ffeb3b"> (</tspan><tspan fill="#ffeb3b">hi</tspan><tspan fill="#ffeb3b"> + </tspan><tspan fill="#ffa77e">0.05</tspan><tspan fill="#ffeb3b">) / (</tspan><tspan fill="#ffeb3b">lo</tspan><tspan fill="#ffeb3b"> + </tspan><tspan fill="#ffa77e">0.05</tspan><tspan fill="#ffeb3b">)</tspan></text>
  <text x="40" y="298" fill="#d9d9d9" text-anchor="end">10</text>
  <text x="40" y="324" fill="#d9d9d9" text-anchor="end">11</text>
  <text x="56" y="324" xml:space="preserve"><tspan fill="#ffffff" font-weight="700">pub struct</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#e5c7ff">Profile</tspan><tspan fill="#ffeb3b"> { </tspan><tspan fill="#ffffff">name</tspan><tspan fill="#ffeb3b">: </tspan><tspan fill="#e5c7ff">String</tspan><tspan fill="#ffeb3b">, </tspan><tspan fill="#ffffff">size</tspan><tspan fill="#ffeb3b">: </tspan><tspan fill="#e5c7ff">u8</tspan><tspan fill="#ffeb3b"> }</tspan></text>
  <text x="40" y="350" fill="#d9d9d9" text-anchor="end">12</text>
  <text x="56" y="350" xml:space="preserve"><tspan fill="#ffffff" font-weight="700">let</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#ffeb3b">floor</tspan><tspan fill="#ffeb3b">: </tspan><tspan fill="#e5c7ff">f64</tspan><tspan fill="#ffeb3b"> = </tspan><tspan fill="#ffa77e">7.0</tspan><tspan fill="#ffeb3b">; </tspan><tspan fill="#88c200" font-style="italic">// WCAG AAA</tspan></text>
  <text x="40" y="376" fill="#d9d9d9" text-anchor="end">13</text>
  <text x="40" y="402" fill="#d9d9d9" text-anchor="end">14</text>
  <text x="56" y="402" xml:space="preserve"><tspan fill="#ffeb3b">&lt;</tspan><tspan fill="#ffffff" font-weight="700">a</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#ffffff">href</tspan><tspan fill="#ffeb3b">=</tspan><tspan fill="#43f480">&quot;/themes/&quot;</tspan><tspan fill="#ffeb3b">&gt;Code themes&lt;/</tspan><tspan fill="#ffffff" font-weight="700">a</tspan><tspan fill="#ffeb3b">&gt;</tspan></text>
  <text x="40" y="428" fill="#d9d9d9" text-anchor="end">15</text>
  <text x="56" y="428" xml:space="preserve"><tspan fill="#28f74f">+ comments keep 7:1 contrast</tspan></text>
  <text x="40" y="454" fill="#d9d9d9" text-anchor="end">16</text>
  <text x="56" y="454" xml:space="preserve"><tspan fill="#ffa59d">- comments faded to grey</tspan></text>
  <text x="40" y="480" fill="#d9d9d9" text-anchor="end">17</text>
  <text x="56" y="480" xml:space="preserve"><tspan fill="#ffa59d" text-decoration="underline">let 7up = 1;</tspan><tspan fill="#ffeb3b"> </tspan><tspan fill="#88c200" font-style="italic">// invalid: underlined</tspan></text>
