<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-label="Zacess Yellow on Black code theme preview: TypeScript, Python, Rust, HTML and diff lines in #ffeb3b on #000000. Keywords are bold, comments and parameters italic and invalid code underlined.">
  <title>Zacess Yellow on Black code theme preview: TypeScript, Python, Rust, HTML and diff lines in #ffeb3b on #000000. Keywords are bold, comments and parameters italic and invalid code underlined.</title>
  <rect width="720" height="530" fill="#000000"/>
  <rect width="720" height="40" fill="#0d0d0d"/>
  <rect y="40" width="720" height="1" fill="#7a7a7a"/>
