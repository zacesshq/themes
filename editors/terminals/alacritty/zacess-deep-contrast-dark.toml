# Zacess Deep Contrast Dark
# generated by scripts/build.mjs from palette/zacess.json, do not edit by hand

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.cursor]
cursor = "#ffff00"
text = "#000000"

[colors.selection]
background = "#ff70ff"
text = "#000000"

[colors.normal]
black = "#000000"
red = "#ff5f5f"
green = "#00cd00"
yellow = "#cdcd00"
blue = "#8888ff"
magenta = "#ff2aff"
cyan = "#00cdcd"
white = "#e5e5e5"

[colors.bright]
black = "#b8b8b8"
red = "#ff9e9e"
green = "#00ff00"
yellow = "#ffff00"
blue = "#b0b0ff"
magenta = "#ff8fff"
cyan = "#00ffff"
white = "#ffffff"

# dim text keeps the normal colours, so it never drops below their floor
[colors.dim]
black = "#000000"
red = "#ff5f5f"
green = "#00cd00"
yellow = "#cdcd00"
blue = "#8888ff"
magenta = "#ff2aff"
cyan = "#00cdcd"
white = "#e5e5e5"
