# Zacess Deep Contrast Light
# generated by scripts/build.mjs from palette/zacess.json, do not edit by hand

[colors.primary]
background = "#ffffff"
foreground = "#000000"

[colors.cursor]
cursor = "#000000"
text = "#ffffff"

[colors.selection]
background = "#990098"
text = "#ffffff"

[colors.normal]
black = "#000000"
red = "#ca0000"
green = "#00892e"
yellow = "#ad6500"
blue = "#0040ff"
magenta = "#cd01cd"
cyan = "#016e78"
white = "#595959"

[colors.bright]
black = "#404040"
red = "#d14100"
green = "#00884f"
yellow = "#907300"
blue = "#0d00ff"
magenta = "#db009a"
cyan = "#0178c1"
white = "#000000"

# dim text keeps the normal colours, so it never drops below their floor
[colors.dim]
black = "#000000"
red = "#ca0000"
green = "#00892e"
yellow = "#ad6500"
blue = "#0040ff"
magenta = "#cd01cd"
cyan = "#016e78"
white = "#595959"
